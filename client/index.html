<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gestiona tus repositorios de GitHub mediante lenguaje natural con inteligencia artificial de Google Gemini." />
    <meta name="theme-color" content="#0d1117" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Asistente de IA de GitHub</title>
    <!-- #71: anti-FOUC — aplica el tema ANTES del primer paint de React,
         leyendo localStorage('app-theme') y, en 'auto', prefers-color-scheme.
         El ThemeProvider re-aplicará el mismo valor al montar (sin flash). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('app-theme');
          var valid = ['light', 'dark', 'auto'].indexOf(saved) !== -1 ? saved : 'auto';
          var resolved =
            valid === 'auto'
              ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
              : valid;
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
