# .gitleaks.toml — Configuración Gitleaks para github-ai-assistant
# Documentación: https://github.com/gitleaks/gitleaks#configuration

title = "github-ai-assistant gitleaks config"

[extend]
# Extender la configuración por defecto de gitleaks
useDefault = true

[allowlist]
description = "Global allowlist for i18n translation files, unit tests, and E2E suites"
paths = [
  '''client/src/i18n/.*\.ts$''',
  '''client/src/.*__tests__/.*''',
  '''client/src/.*\.test\.(ts|tsx)$''',
  '''server/__tests__/.*''',
  '''e2e/.*\.ts$'''
]
