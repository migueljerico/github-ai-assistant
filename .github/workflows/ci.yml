name: CI & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # Cache removed to ensure fresh install of new dependencies

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage || echo "No coverage script found yet"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  server-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install root dependencies
        run: npm install

      - name: Run server tests
        run: npm run test:server

  # ─── Seguridad (Hallazgo #2, v3.50.0) ────────────────────────────────────
  # gitleaks: escaneo de secretos en todo el historial del PR/push. SÍ rompe
  # el CI si encuentra un secreto (gate duro).
  # npm audit: informativo. NO rompe el CI: `|| true` porque algunas advisories
  # no tienen fix disponible (p.ej. xlsx/SheetJS GHSA-4r6h-8v6p-xvw6 y
  # GHSA-5pgg-2g8v-p4x9, "No fix available"). Sin el `|| true`, una advisory
  # sin parche bloquearía todos los merges indefinidamente. El reporte queda
  # visible en el log del job para seguimiento manual.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks necesita el historial completo

      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE no se configura: el modo público/opensource basta
          # para escanear pushes. Si se quieren re-gates SARIF en el repo,
          # añadir GITLEAKS_LICENSE en Settings → Secrets.

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: npm audit (server)
        run: npm audit --audit-level=high --omit=dev || true

      - name: npm audit (client)
        run: npm audit --audit-level=high --omit=dev || true
        working-directory: client
