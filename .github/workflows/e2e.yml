name: E2E

# Workflow dedicado de tests E2E (#75, v3.61.0). Separado de `CI & Coverage`
# (ci.yml) en v3.63.0 para que el badge de estado del README refleje SOLO el
# resultado de los tests E2E, sin mezclarlo con el del resto del CI.
#
# Mismo trigger y comportamiento que el job `e2e` que vivía en ci.yml: levanta
# Express (webServer del playwright.config) sirviendo el SPA ya construido y
# corre los tests del flujo crítico (e2e/*.spec.ts). Toda la red externa
# (api.github.com + proxies IA) se mockea por página; sin credenciales reales.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install root dependencies (Express + Playwright)
        run: npm install

      - name: Install + build client
        run: npm install && npm run build
        working-directory: client

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
